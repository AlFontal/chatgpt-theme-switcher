name: Build userscript

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run build

      - name: Commit generated userscript
        run: |
          if [ -z "$(git status --porcelain -- dist/chatgpt-theme-switcher.user.js)" ]; then
            echo "dist is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/chatgpt-theme-switcher.user.js
          git commit -m "build: update userscript"
          git push
